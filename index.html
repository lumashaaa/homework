<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Olly</title>
  <link rel="stylesheet" href="styles.css">
  <style>
  </style>
</head>
<body>
  <div class="mainblock">
    <div class="header">
      <div class="logo">OLLY</div>
      <div class="menu">
        <div class="item">Главная</div>
        <div class="item">Услуги</div>
        <div class="item">Контакты</div>
      </div>
    </div>

    <div class="banner">
      <img src="https://goodzel.ru/wp-content/uploads/2021/03/salony-krasoty.jpg">
      <div class="bannertext">Добро пожаловать в лучший салон красоты в городе!</div>
    </div>

    <div class="content">
      <h2>Наши услуги</h2>
      <div class="service">
        <div class="title">💅 Маникюр</div>
        <div class="desc">Самый лучший маникюр в городе!</div>
      </div>

      <div class="service">
        <div class="title">💇 Стрижки</div>
        <div class="desc">Любой стиль — от классики до креатива!</div>
      </div>

      <div class="service">
        <div class="title">💆 Окрашивание </div>
        <div class="desc">От базового до яркого! </div>
      </div>
    </div>

    <div class="formblock">
      <h2>Записаться онлайн</h2>
      <form>
        <input placeholder="Имя">
        <input placeholder="Телефон">
        <textarea placeholder="Сообщение"></textarea>
        <button>Отправить</button>
      </form>
    </div>

    <div class="footer">
      <div>Olly — салон красоты</div>
    
      </div>
    </div>
  </div>
</body>
</html>
